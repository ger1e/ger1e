<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">GER1E operating principles and motto</title><desc id="d">Terminal-style footer with three operating principles and the motto Ad Astra Per Aspera.</desc><defs><radialGradient id="bg" cx="50%" cy="60%" r="80%"><stop stop-color="#0a1c35"/><stop offset=".6" stop-color="#030a14"/><stop offset="1" stop-color="#010207"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2470ff" stop-opacity="0"/><stop offset=".5" stop-color="#88f7ff"/><stop offset="1" stop-color="#2470ff" stop-opacity="0"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs><rect width="720" height="300" rx="16" fill="url(#bg)"/><rect x="2" y="2" width="716" height="296" rx="16" fill="none" stroke="#3fd6ff" stroke-opacity=".24"/><text x="28" y="40" class="m" font-size="17" letter-spacing="2" fill="#739bc0">OPERATING PRINCIPLES</text><text x="692" y="40" text-anchor="end" class="m" font-size="17" letter-spacing="2" fill="#739bc0">EOF://GER1E</text><path d="M28 60H692" stroke="#3fd6ff" stroke-opacity=".18"/><g class="m" font-size="18"><text x="36" y="104" fill="#e7fbff"><tspan fill="#72e5ff" font-weight="900">01</tspan> DETECTION ENGINEERING WITHOUT TELEMETRY = A WISH</text><text x="36" y="142" fill="#e7fbff"><tspan fill="#72e5ff" font-weight="900">02</tspan> INTELLIGENCE WITHOUT PROVENANCE = A RUMOR</text><text x="36" y="180" fill="#e7fbff"><tspan fill="#72e5ff" font-weight="900">03</tspan> AUTOMATION WITHOUT CONTEXT = FASTER WRONGNESS</text></g><path d="M120 220H600" stroke="#2c88c5" stroke-opacity=".22"/><rect x="120" y="219" width="120" height="3" fill="url(#beam)"><animate attributeName="x" values="120;480;120" dur="9s" repeatCount="indefinite"/></rect><text x="360" y="262" text-anchor="middle" class="m" font-size="25" font-weight="900" letter-spacing="3" fill="#8df7ff">AD ASTRA PER ASPERA</text></svg>