<rect x="34" y="494" width="652" height="3" fill="#1e6fff" opacity=".22"/><rect x="34" y="494" width="150" height="3" fill="url(#g)" filter="url(#gl)"><animate attributeName="x" values="34;536;34" dur="14s" repeatCount="indefinite"/></rect>
