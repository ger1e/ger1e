<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d">
<title id="t">GER1E mobile signal banner</title><desc id="d">Mobile-first cyan cobalt banner retaining the stylized GER1E mark, John Kiriakou quote, radar sweep and animated Matrix rain.</desc>
<defs>
  <radialGradient id="bg" cx="48%" cy="36%" r="88%"><stop offset="0" stop-color="#0a1f3d"/><stop offset=".48" stop-color="#03101f"/><stop offset="1" stop-color="#000207"/></radialGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00030a" stop-opacity=".10"/><stop offset=".22" stop-color="#00030a" stop-opacity=".50"/><stop offset=".55" stop-color="#00030a" stop-opacity=".78"/><stop offset=".78" stop-color="#00030a" stop-opacity=".72"/><stop offset="1" stop-color="#00030a" stop-opacity=".18"/></linearGradient>
  <linearGradient id="sweep"><stop stop-color="#7cf2ff" stop-opacity=".78"/><stop offset="1" stop-color="#2d72ff" stop-opacity="0"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#66dfff" stroke-opacity=".03" stroke-width=".5"/></pattern>
