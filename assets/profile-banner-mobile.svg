<rect x="52" y="376" width="520" height="2" fill="#38cfff" opacity=".38"/><rect x="52" y="376" width="140" height="2" fill="#89f5ff" filter="url(#soft)"><animate attributeName="x" values="52;432;52" dur="17.2s" repeatCount="indefinite"/></rect>
<text x="54" y="425" class="mono" font-size="20" font-weight="800" letter-spacing="2.2" fill="#75dfff">THREAT HUNTING // CTI</text>
<text x="54" y="460" class="mono" font-size="18" font-weight="700" letter-spacing="1.5" fill="#75dfff">DETECTION ENGINEERING // INCIDENT RESPONSE</text>
<text x="54" y="510" class="mono" font-size="17" letter-spacing="1.1" fill="#5e8fb9">HYPOTHESIS → TELEMETRY → EVIDENCE → TUNING</text>
<g class="mono" text-anchor="middle"><text x="360" y="590" font-size="21" fill="#dcecff">“Anybody who sheds light on the darkness</text><text x="360" y="621" font-size="21" fill="#dcecff">is the enemy.”</text><text x="360" y="659" font-size="17" font-weight="800" letter-spacing="2" fill="#79dfff">— JOHN KIRIAKOU</text></g>
