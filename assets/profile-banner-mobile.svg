  <g id="c1"><text x="0" y="0" text-anchor="middle">尺<tspan x="0" dy="18">ヒ</tspan><tspan x="0" dy="18">乇</tspan><tspan x="0" dy="18">ノ</tspan><tspan x="0" dy="18">シ</tspan><tspan x="0" dy="18">エ</tspan><tspan x="0" dy="18">1</tspan><tspan x="0" dy="18">ネ</tspan><tspan x="0" dy="18">ト</tspan><tspan x="0" dy="18">サ</tspan><tspan x="0" dy="18">セ</tspan><tspan x="0" dy="18">シ</tspan></text></g>
  <g id="c2"><text x="0" y="0" text-anchor="middle">シ<tspan x="0" dy="18">ノ</tspan><tspan x="0" dy="18">イ</tspan><tspan x="0" dy="18">コ</tspan><tspan x="0" dy="18">ナ</tspan><tspan x="0" dy="18">キ</tspan><tspan x="0" dy="18">ク</tspan><tspan x="0" dy="18">ヌ</tspan><tspan x="0" dy="18">1</tspan><tspan x="0" dy="18">乇</tspan><tspan x="0" dy="18">ヒ</tspan><tspan x="0" dy="18">ニ</tspan></text></g>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.back{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#2f6fff;fill-opacity:.17}.mid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#35bfff;fill-opacity:.28}.fore{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#68eaff;fill-opacity:.46}</style>
</defs>
