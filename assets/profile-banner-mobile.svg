</g>
<rect width="720" height="720" rx="16" fill="url(#shield)"/>
<rect width="720" height="720" rx="16" fill="url(#scan)"/>
<g class="mono" font-size="15" letter-spacing="2.1" fill="#6591bd"><text x="28" y="38">NODE://GER1E</text><text x="692" y="38" text-anchor="end">PUBLIC-SANITIZED</text></g>
<g transform="translate(560 150)" class="mono"><circle r="86" fill="#0a203d" fill-opacity=".28" stroke="#35bfff" stroke-opacity=".18"/><circle r="62" fill="none" stroke="#35bfff" stroke-opacity=".25"/><circle r="38" fill="none" stroke="#35bfff" stroke-opacity=".22"/><path d="M-86 0H86M0-86V86" stroke="#35bfff" stroke-opacity=".14"/><path d="M0 0H82L0 0Z" fill="url(#sweep)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18.8s" repeatCount="indefinite"/></path><g fill="#8cf5ff" filter="url(#soft)"><circle cx="42" cy="-31" r="3"/><circle cx="-29" cy="45" r="2.6"/><circle cx="56" cy="22" r="2.4"/><circle cx="-50" cy="-18" r="2.2"/></g><text y="-99" text-anchor="middle" font-size="12" letter-spacing="1.7" fill="#5b9dff">SIGNAL FUSION</text></g>
