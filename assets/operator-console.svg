<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">GERG1E public operator console</title>
<desc id="d">Cobalt operator profile showing experience, investigation surfaces, methods, credentials and career progression.</desc>
<defs>
