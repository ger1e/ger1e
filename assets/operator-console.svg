  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1.6px}.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.4px}</style>
</defs>
<rect width="1200" height="420" rx="10" fill="url(#bg)"/>
<rect width="1200" height="420" rx="10" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="418" rx="10" fill="none" stroke="#4589ff" stroke-opacity=".28"/>
