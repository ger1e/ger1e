<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GER1E — glitch signal node</title>
  <desc id="desc">Black cyberpunk banner with a neon GER1E wordmark, fast Matrix rain, glitch offsets, scan lines, and threat-hunting telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010303"/>
      <stop offset=".52" stop-color="#030807"/>
      <stop offset="1" stop-color="#010405"/>
    </linearGradient>
    <radialGradient id="aura" cx="52%" cy="48%" r="62%">
