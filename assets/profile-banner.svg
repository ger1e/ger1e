<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GER1E — heavy glitch signal node</title>
  <desc id="desc">Black cyberpunk banner with a neon GER1E wordmark, dense fast Matrix rain, aggressive RGB glitch slices, scan lines, and threat-hunting telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010303"/>
      <stop offset=".48" stop-color="#020a08"/>
      <stop offset="1" stop-color="#010405"/>
    </linearGradient>
    <radialGradient id="aura" cx="48%" cy="46%" r="68%">
      <stop offset="0" stop-color="#63f5d0" stop-opacity=".15"/>
      <stop offset=".42" stop-color="#35d8e8" stop-opacity=".055"/>
      <stop offset="1" stop-color="#35d8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effffa" stop-opacity=".96"/>
      <stop offset=".10" stop-color="#b7ff52" stop-opacity=".82"/>
      <stop offset=".32" stop-color="#63f5d0" stop-opacity=".58"/>
      <stop offset="1" stop-color="#63f5d0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#d8fff8" stroke-opacity=".045" stroke-width=".7"/>
    </pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#63f5d0" stroke-opacity=".034" stroke-width=".8"/>
    </pattern>
    <filter id="glow" x="-70%" y="-90%" width="240%" height="280%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="microglow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="14" y="14" width="1172" height="272" rx="5"/></clipPath>
    <clipPath id="slice1"><rect x="48" y="75" width="780" height="16"/></clipPath>
    <clipPath id="slice2"><rect x="48" y="98" width="780" height="23"/></clipPath>
    <clipPath id="slice3"><rect x="48" y="126" width="780" height="13"/></clipPath>
