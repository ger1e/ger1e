<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">GER1E mobile threat radar</title><desc id="d">Mobile-first cyan cobalt threat radar and signal-fusion path from telemetry and CTI to hunting and detection.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#01040b"/><stop offset=".52" stop-color="#06152d"/><stop offset="1" stop-color="#01040b"/></linearGradient><radialGradient id="rf"><stop stop-color="#49dfff" stop-opacity=".12"/><stop offset="1" stop-color="#2470ff" stop-opacity="0"/></radialGradient><linearGradient id="sw"><stop stop-color="#78f1ff" stop-opacity=".8"/><stop offset="1" stop-color="#2878ff" stop-opacity="0"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.8px}</style></defs><rect width="720" height="980" rx="18" fill="url(#bg)"/><rect x="2" y="2" width="716" height="976" rx="18" fill="none" stroke="#45dfff" stroke-opacity=".22"/><g class="m" font-size="18" letter-spacing="2" fill="#668eb7"><text x="28" y="42">RADAR://PUBLIC</text><text x="692" y="42" text-anchor="end">EVIDENCE FIRST</text></g><g transform="translate(360 215)"><circle r="128" fill="url(#rf)" stroke="#45dfff" stroke-opacity=".26"/><circle r="96" fill="none" stroke="#45dfff" stroke-opacity=".2"/><circle r="64" fill="none" stroke="#45dfff" stroke-opacity=".17"/><circle r="32" fill="none" stroke="#45dfff" stroke-opacity=".15"/><path d="M-128 0H128M0-128V128" stroke="#45dfff" stroke-opacity=".13"/><path d="M0 0H124L0 0Z" fill="url(#sw)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></path><g fill="#8df6ff"><circle cx="58" cy="-58" r="5"/><circle cx="-74" cy="38" r="4.5"/><circle cx="86" cy="62" r="4"/><circle cx="-38" cy="-84" r="4"/></g><g class="m" font-size="17" fill="#83c9eb"><text x="70" y="-65">IDENTITY</text><text x="-150" y="34">ENDPOINT</text><text x="95" y="59">NETWORK</text><text x="-94" y="-94">CTI</text></g></g><text x="360" y="382" text-anchor="middle" class="m" font-size="19" letter-spacing="1.5" fill="#56dfff">SIGNAL FUSION PATH</text>
<g class="m"><g transform="translate(60 420)"><rect width="600" height="116" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".3"/><text x="26" y="42" class="h" font-size="27" fill="#e3fcff">01 // TELEMETRY</text><text x="26" y="78" font-size="20" fill="#8ebbd6">readiness · gaps · endpoint · identity · auth</text></g><path d="M360 536V572" stroke="#46dfff" stroke-opacity=".4" stroke-width="3"/><g transform="translate(60 572)"><rect width="600" height="116" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".3"/><text x="26" y="42" class="h" font-size="27" fill="#e3fcff">02 // CORRELATE</text><text x="26" y="78" font-size="20" fill="#8ebbd6">behavior · context · campaign · provenance · confidence</text></g><path d="M360 688V724" stroke="#46dfff" stroke-opacity=".4" stroke-width="3"/><g transform="translate(60 724)"><rect width="600" height="116" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".3"/><text x="26" y="42" class="h" font-size="27" fill="#e3fcff">03 // HUNT</text><text x="26" y="78" font-size="20" fill="#8ebbd6">falsifiable hypothesis · cheap filters · analyst output</text></g><path d="M360 840V876" stroke="#46dfff" stroke-opacity=".4" stroke-width="3"/><g transform="translate(60 876)"><rect width="600" height="78" rx="12" fill="#07162c" stroke="#64e8ff" stroke-opacity=".5"/><text x="26" y="48" class="h" font-size="27" fill="#f0feff">04 // DETECTION</text><text x="330" y="48" font-size="19" fill="#9ad5eb">evidence-backed · tuned · coverage-aware</text></g></g><text x="360" y="972" text-anchor="middle" class="m" font-size="16" letter-spacing="1.2" fill="#56dfff">BEHAVIOR + CONTEXT + TELEMETRY DECIDE PRIORITY</text></svg>