  <g class="m" font-size="16" fill="#83c9eb"><text x="68" y="-62">IDENTITY</text><text x="-144" y="32">ENDPOINT</text><text x="91" y="56">NETWORK</text><text x="-88" y="-88">CTI</text></g>
</g>
<text x="360" y="350" text-anchor="middle" class="m" font-size="18" letter-spacing="1.5" fill="#56dfff">SIGNAL FUSION PATH</text>
<g class="m">
  <g transform="translate(58 390)"><rect width="604" height="120" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".30"/><text x="26" y="39" class="h" font-size="25" fill="#e3fcff">01 // TELEMETRY</text><text x="26" y="72" font-size="18" fill="#8ebbd6">readiness · gaps · endpoint</text><text x="26" y="98" font-size="18" fill="#8ebbd6">identity · auth</text></g>
  <path d="M360 510V536" stroke="#46dfff" stroke-opacity=".40" stroke-width="3"/>
  <g transform="translate(58 536)"><rect width="604" height="120" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".30"/><text x="26" y="39" class="h" font-size="25" fill="#e3fcff">02 // CORRELATE</text><text x="26" y="72" font-size="18" fill="#8ebbd6">behavior · context · campaign</text><text x="26" y="98" font-size="18" fill="#8ebbd6">provenance · confidence</text></g>
  <path d="M360 656V682" stroke="#46dfff" stroke-opacity=".40" stroke-width="3"/>
  <g transform="translate(58 682)"><rect width="604" height="120" rx="12" fill="#030a16" stroke="#3ccfff" stroke-opacity=".30"/><text x="26" y="39" class="h" font-size="25" fill="#e3fcff">03 // HUNT</text><text x="26" y="72" font-size="18" fill="#8ebbd6">falsifiable hypothesis · cheap filters</text><text x="26" y="98" font-size="18" fill="#8ebbd6">analyst-useful output</text></g>
  <path d="M360 802V828" stroke="#46dfff" stroke-opacity=".40" stroke-width="3"/>
