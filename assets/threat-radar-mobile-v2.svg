  <radialGradient id="rf"><stop stop-color="#49dfff" stop-opacity=".12"/><stop offset="1" stop-color="#2470ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw"><stop stop-color="#78f1ff" stop-opacity=".8"/><stop offset="1" stop-color="#2878ff" stop-opacity="0"/></linearGradient>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.5px}</style>
</defs>
<rect width="720" height="940" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="716" height="936" rx="18" fill="none" stroke="#45dfff" stroke-opacity=".22"/>
