name: account-polish-lint

on:
  pull_request:
    paths:
      - tools/pimp-github.ps1
      - .github/workflows/account-polish-lint.yml
  push:
    branches: [main]
    paths:
      - tools/pimp-github.ps1
      - .github/workflows/account-polish-lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell without executing account writes
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './tools/pimp-github.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell syntax: PASS'
