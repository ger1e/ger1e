name: profile-quality-gates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - README.md
      - 'assets/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/**'
      - 'tools/pimp-github.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate public profile surface
        shell: bash
        run: |
          set -euo pipefail

          required=(
            'README.md'
            'assets/profile-banner-v11.svg'
            'assets/operator-console-v10.svg'
            'assets/threat-radar-v7.svg'
            'assets/career-vector-v7.svg'
            'assets/footer-terminal-v9.svg'
            '.github/CODEOWNERS'
          )

          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required public-profile asset is missing or empty."
              exit 1
            fi
          done

          grep -Fq 'https://gergoilly.hu/' README.md || {
            echo '::error file=README.md::Profile must link the canonical personal site.'
            exit 1
          }

          grep -Fq 'ger1e/personal-site-lp' README.md || {
            echo '::error file=README.md::Canonical personal-site source must remain part of the public signal.'
            exit 1
          }

          obsolete=(
            'cti-enrichment-gateway'
            'cti-enrichment-gateway.vercel.app'
          )

          for value in "${obsolete[@]}"; do
            if grep -Fq "$value" README.md; then
              echo "::error file=README.md::Obsolete PARA11AX compatibility surface remains: $value"
              exit 1
            fi
          done

          legacy_routes=(
            '/api/meta'
            '/api/health'
            '/api/status'
            '/api/enrich'
            '/api/batch'
            '/api/stix'
          )

          for route in "${legacy_routes[@]}"; do
            if grep -Fq "$route" README.md; then
              echo "::error file=README.md::Legacy unprefixed PARA11AX route remains: $route"
              exit 1
            fi
          done

          grep -Fq 'https://github.com/ger1e/para11ax' README.md || {
            echo '::error file=README.md::Canonical PARA11AX repository must remain part of the public signal.'
            exit 1
          }

          grep -Fq 'https://para11ax.vercel.app/' README.md || {
            echo '::error file=README.md::Canonical PARA11AX production URL must remain part of the public signal.'
            exit 1
          }

          canonical_routes=(
            '/api/para11ax/meta'
            '/api/para11ax/health'
            '/api/para11ax/status'
            '/api/para11ax/enrich'
            '/api/para11ax/batch'
            '/api/para11ax/stix'
          )

          for route in "${canonical_routes[@]}"; do
            grep -Fq "$route" README.md || {
              echo "::error file=README.md::Canonical PARA11AX route missing: $route"
              exit 1
            }
          done

          if grep -Fq '/hunts/' README.md; then
            echo '::error file=README.md::Do not promote individual example hunts in the profile hierarchy.'
            exit 1
          fi

          grep -Fq 'threat-hunting-lab' README.md || {
            echo '::error file=README.md::Threat-hunting lab must remain part of the public signal.'
            exit 1
          }

          grep -Fq 'HUNTING-METHODOLOGY.md' README.md || {
            echo '::error file=README.md::Profile must link the public hunting methodology.'
            exit 1
          }

          grep -Fq 'CTI-NORMALIZATION.md' README.md || {
            echo '::error file=README.md::Profile must link the public CTI normalization model.'
            exit 1
          }

          echo 'Profile content contract: PASS'

      - name: Enforce immutable GitHub Action refs
        shell: python
        run: |
          from pathlib import Path
          import re

          action_line = re.compile(r'^\s*-\s+uses:\s+([^#\s]+)')
          sha = re.compile(r'^[0-9a-fA-F]{40}$')
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = action_line.match(line)
                  if not match:
                      continue
                  target = match.group(1)
                  if target.startswith('./') or target.startswith('docker://'):
                      continue
                  if '@' not in target:
                      failures.append(f'{path}:{number}: missing ref: {target}')
                      continue
                  ref = target.rsplit('@', 1)[1]
                  if not sha.fullmatch(ref):
                      failures.append(f'{path}:{number}: mutable action ref: {target}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Immutable Action refs: PASS')

      - name: Validate SVG assets and mobile text budget
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          files = [
              Path('assets/profile-banner-v11.svg'),
              Path('assets/operator-console-v10.svg'),
              Path('assets/threat-radar-v7.svg'),
              Path('assets/career-vector-v7.svg'),
              Path('assets/footer-terminal-v9.svg'),
          ]
          text_pattern = re.compile(r'<text\b([^>]*)>(.*?)</text>', re.I | re.S)
          tag_pattern = re.compile(r'<[^>]+>')
          size_pattern = re.compile(r'font-size=["\']([\d.]+)["\']', re.I)

          for path in files:
              ET.parse(path)
              svg = path.read_text(encoding='utf-8')
              for attrs, body in text_pattern.findall(svg):
                  size_match = size_pattern.search(attrs)
                  if not size_match:
                      continue
                  size = float(size_match.group(1))
                  if size < 15 or size >= 90:
                      continue
                  visible = tag_pattern.sub('', body)
                  visible = visible.replace('&amp;', '&').replace('&quot;', '"').replace('&#39;', "'").strip()
                  if len(visible) > 52:
                      raise SystemExit(f'{path}: mobile-risk text row ({len(visible)} > 52): {visible}')
              print(f'{path}: XML + mobile text PASS')

      - name: Parse PowerShell without executing account writes
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './tools/pimp-github.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell syntax: PASS'
