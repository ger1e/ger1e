name: security-catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: security-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reconcile source Markdown into canonical repository catalog
        if: github.event_name != 'pull_request'
        run: python tools/catalog.py reconcile --write
      - name: Parse reconciliation on pull requests
        if: github.event_name == 'pull_request'
        run: python tools/catalog.py reconcile
      - name: Validate and generate repository catalog
        run: |
          python tools/catalog.py validate
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            python tools/catalog.py build
          fi
      - name: Validate and generate provider registry
        run: |
          python tools/catalog.py providers-validate
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            python tools/catalog.py providers-build
          fi
      - name: Refresh repository health
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/catalog.py health --token "$GH_TOKEN" --write
      - name: Final validation
        run: |
          python -m py_compile tools/catalog.py
          python -c "import json; json.load(open('catalog/repos.yaml', encoding='utf-8')); json.load(open('catalog/providers.yaml', encoding='utf-8'))"
          git diff --check
      - name: Commit refreshed catalogs
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/repos.yaml catalog/providers.yaml CATALOG.md PROVIDERS.md LAST-VERIFIED.md
          git commit -m 'chore: refresh security catalogs'
          git push
