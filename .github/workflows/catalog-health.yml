name: security-catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parse reconciliation
        run: python tools/catalog.py reconcile
      - name: Validate repository catalog
        run: python tools/catalog.py validate
      - name: Validate provider registry
        run: python tools/catalog.py providers-validate
      - name: Verify generated catalogs
        run: python tools/catalog.py verify-generated
      - name: Final validation
        run: |
          python -m py_compile tools/catalog.py
          python -c "import json; json.load(open('catalog/repos.yaml', encoding='utf-8')); json.load(open('catalog/providers.yaml', encoding='utf-8'))"
          git diff --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reconcile source Markdown into canonical repository catalog
        run: python tools/catalog.py reconcile --write
      - name: Validate repository catalog
        run: python tools/catalog.py validate
      - name: Validate provider registry
        run: python tools/catalog.py providers-validate
      - name: Refresh repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/catalog.py health --token "$GH_TOKEN" --write
      - name: Generate and verify final catalogs
        run: |
          python tools/catalog.py build
          python tools/catalog.py providers-build
          python tools/catalog.py verify-generated
      - name: Final validation
        run: |
          python -m py_compile tools/catalog.py
          python -c "import json; json.load(open('catalog/repos.yaml', encoding='utf-8')); json.load(open('catalog/providers.yaml', encoding='utf-8'))"
          git diff --check
      - name: Open catalog refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated catalog state already current.'
            exit 0
          fi

          branch='automation/catalog-refresh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add catalog/repos.yaml catalog/providers.yaml CATALOG.md PROVIDERS.md LAST-VERIFIED.md
          git commit -m 'chore: refresh security catalogs'
          git push --force-with-lease --set-upstream origin "$branch"

          pr_count="$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')"
          if [[ ! "$pr_count" =~ ^[0-9]+$ ]]; then
            echo "Invalid catalog refresh PR count: $pr_count" >&2
            exit 1
          fi

          if [[ "$pr_count" == '0' ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore: refresh security catalogs' \
              --body 'Automated generated-state refresh from the security-catalog workflow. Review and merge through the normal protected-branch path.'
          elif [[ "$pr_count" == '1' ]]; then
            echo 'Existing catalog refresh PR updated.'
          else
            echo "Expected at most one open catalog refresh PR; found $pr_count." >&2
            exit 1
          fi
