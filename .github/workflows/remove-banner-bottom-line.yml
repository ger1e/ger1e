name: remove-banner-bottom-line

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  remove:
    if: github.event.issue.user.login == 'ger1e' && github.event.issue.title == '[banner-maintenance] remove bottom signal line'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove bottom signal text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/profile-banner.svg')
          s = p.read_text(encoding='utf-8')
          target = '    <text x="0" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" letter-spacing="2.2" fill="#80938e">EVIDENCE &gt; ASSUMPTION  /  SIGNAL &gt; VOLUME</text>\n'
          if target not in s:
              raise SystemExit('target bottom signal line not found')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
          ! grep -q 'EVIDENCE &gt; ASSUMPTION' assets/profile-banner.svg
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-banner.svg
          git commit -m 'style: remove banner bottom signal line'
          git push
