name: apply-account-governance-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-account-governance-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical account governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run account-governance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f dry_run=false
