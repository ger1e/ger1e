name: run-catalog-schema-patcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-catalog-schema-patcher.yml'

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/markdown-schema-generator
          fetch-depth: 0

      - name: Execute staged patcher from review branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/catalog-schema-persist.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patcher marker not found')
          embedded = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          embedded = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(embedded, '<catalog-schema-patcher>', 'exec'))
          PY

          git rm -f .github/workflows/catalog-schema-persist.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog.py tests/test_catalog.py
          git commit -m 'fix: preserve markdown schema in catalog tooling'
          git push origin HEAD:fix/markdown-schema-generator
