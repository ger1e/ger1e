name: run-catalog-schema-patcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-catalog-schema-patcher.yml'

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/markdown-schema-generator
          fetch-depth: 0

      - name: Fix renderer indentation from staged patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/catalog.py')
          src = path.read_text(encoding='utf-8')

          def add_indent_between(text, start_marker, end_marker, spaces=10):
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              fixed = '\n'.join(
                  ((' ' * spaces) + line) if line.strip() else line
                  for line in block.split('\n')
              )
              return text[:start] + fixed + text[end:]

          src = add_indent_between(
              src,
              '        for item in sorted(groups[category], key=lambda x: x["repo"].lower()):\n',
              '        lines.append("")\n',
          )
          src = add_indent_between(
              src,
              '        for item in sorted(groups[role], key=lambda x: x["name"].lower()):\n',
              '    lines += doc_footer()\n',
          )
          src = add_indent_between(
              src,
              '        for row in exceptions:\n',
              '        lines.append("")\n',
          )
          path.write_text(src, encoding='utf-8')
          PY

          python -m py_compile tools/catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog.py
          git commit -m 'fix: normalize catalog renderer indentation'
          git push origin HEAD:fix/markdown-schema-generator
