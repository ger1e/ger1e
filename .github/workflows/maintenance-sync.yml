name: maintenance-sync

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: github.event.issue.user.login == 'ger1e' && github.event.issue.title == '[maintenance-sync] refresh generated assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test catalog tooling
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reconcile repository catalog
        run: |
          python tools/catalog.py reconcile --write
          python tools/catalog.py validate
          python tools/catalog.py build
      - name: Validate provider registry
        run: |
          python tools/catalog.py providers-validate
          python tools/catalog.py providers-build
      - name: Refresh repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/catalog.py health --token "$GH_TOKEN" --write
      - name: Fetch CySA+ badge PNG
        run: |
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'
      - name: Fetch eCTHP badge PNG
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://assets.ine.com/els-static/els-certs/ecthpv2.png' \
            --output assets/badges/ecthp.png
          test "$(file --brief --mime-type assets/badges/ecthp.png)" = 'image/png'
      - name: Fetch SAL2 badge PNG
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://tryhackme.com/static/image/sal2-card.3660689e.png' \
            --output assets/badges/sal2.png
          test "$(file --brief --mime-type assets/badges/sal2.png)" = 'image/png'
      - name: Final validation
        run: |
          python -m py_compile tools/catalog.py
          python -c "import json; json.load(open('catalog/repos.yaml', encoding='utf-8')); json.load(open('catalog/providers.yaml', encoding='utf-8'))"
          git diff --check
      - name: Commit generated state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/repos.yaml catalog/providers.yaml CATALOG.md PROVIDERS.md LAST-VERIFIED.md assets/badges/cysa-plus.png assets/badges/ecthp.png assets/badges/sal2.png
          git commit -m 'chore: reconcile catalogs and credential assets'
          git push
