name: maintenance-sync

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: github.event.issue.user.login == 'ger1e' && github.event.issue.title == '[maintenance-sync] refresh generated assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Test catalog tooling
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reconcile repository catalog
        run: |
          python tools/catalog.py reconcile --write
          python tools/catalog.py validate
          python tools/catalog.py build
      - name: Validate provider registry
        run: |
          python tools/catalog.py providers-validate
          python tools/catalog.py providers-build
      - name: Refresh repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/catalog.py health --token "$GH_TOKEN" --write
      - name: Fetch CySA+ from Credly
        run: |
          set -euo pipefail
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'
      - name: Resolve SAL2 strictly from Credly
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.credly.com/org/tryhackme/badge/security-analyst-level-2-sal2'
          curl --fail --location --retry 3 --retry-delay 2 "$page" --output /tmp/sal2.html
          grep -qi 'Security Analyst Level 2' /tmp/sal2.html
          python - <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path('/tmp/sal2.html').read_text(encoding='utf-8', errors='replace')

          class MetaImages(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  a = {k.lower(): v for k, v in attrs if k and v}
                  key = (a.get('property') or a.get('name') or '').lower()
                  value = a.get('content', '')
                  if key in {'og:image', 'twitter:image'} and 'images.credly.com' in value:
                      self.urls.append(value)

          parser = MetaImages()
          parser.feed(source)
          urls = list(parser.urls)
          urls.extend(re.findall(r'https:(?:\\u002[fF]|\\/|/){2}images\.credly\.com[^"\'<>\s]+', source))

          ids = []
          for raw in urls:
              url = unescape(raw).replace('\\u002F', '/').replace('\\u002f', '/').replace('\\/', '/')
              m = re.search(r'/images/([0-9a-fA-F-]{36})(?:/|$)', url)
              if m and m.group(1).lower() not in ids:
                  ids.append(m.group(1).lower())

          if not ids:
              raise SystemExit('No Credly CDN asset IDs found on SAL2 page')

          Path('/tmp/sal2-candidates').write_text(
              '\n'.join(f'https://images.credly.com/size/340x340/images/{asset_id}/image.png' for asset_id in ids) + '\n',
              encoding='utf-8',
          )
          PY

          found=0
          while IFS= read -r candidate; do
            rm -f /tmp/sal2-candidate.png
            if ! curl --fail --location --retry 2 --retry-delay 1 "$candidate" --output /tmp/sal2-candidate.png; then
              continue
            fi
            if [ "$(file --brief --mime-type /tmp/sal2-candidate.png)" != 'image/png' ]; then
              continue
            fi
            if ! python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('/tmp/sal2-candidate.png').read_bytes()
          if p[:8] != b'\x89PNG\r\n\x1a\n' or p[12:16] != b'IHDR':
              raise SystemExit(1)
          w, h = struct.unpack('>II', p[16:24])
          if w != h or w < 200:
              raise SystemExit(1)
          PY
            then
              continue
            fi
            mv /tmp/sal2-candidate.png assets/badges/sal2.png
            printf '%s\n' "$candidate" > assets/badges/sal2.source.txt
            found=1
            break
          done < /tmp/sal2-candidates
          test "$found" -eq 1
      - name: Fetch eCTHP PNG from current INE certification page asset
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://us-east-1.graphassets.com/AwCYQkwjSUCbfkm08Ct1Mz/output=format:png/cmcc3k3loazi006k52vly6jlo' \
            --output assets/badges/ecthp.png
          test "$(file --brief --mime-type assets/badges/ecthp.png)" = 'image/png'
      - name: Final validation
        run: |
          python -m py_compile tools/catalog.py
          python -c "import json; json.load(open('catalog/repos.yaml', encoding='utf-8')); json.load(open('catalog/providers.yaml', encoding='utf-8'))"
          git diff --check
      - name: Commit generated state
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/repos.yaml catalog/providers.yaml CATALOG.md PROVIDERS.md LAST-VERIFIED.md
          git add -A assets/badges
          git commit -m 'chore: reconcile catalogs and credential assets'
          git push
