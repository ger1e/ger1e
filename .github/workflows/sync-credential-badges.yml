name: sync-credential-badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-credential-badges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch CySA+ from Credly
        run: |
          set -euo pipefail
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'

      - name: Resolve SAL2 from Credly
        run: |
          set -euo pipefail
          page='https://www.credly.com/org/tryhackme/badge/security-analyst-level-2-sal2'
          curl --fail --location --retry 3 --retry-delay 2 "$page" --output /tmp/sal2.html
          grep -qi 'Security Analyst Level 2' /tmp/sal2.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class MetaImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  values = {k.lower(): v for k, v in attrs if k and v}
                  key = (values.get("property") or values.get("name") or "").lower()
                  if key in {"og:image", "twitter:image"} and values.get("content"):
                      self.urls.append(values["content"])

          parser = MetaImageParser()
          parser.feed(Path('/tmp/sal2.html').read_text(encoding='utf-8', errors='replace'))
          url = next((u for u in parser.urls if u.startswith('https://images.credly.com/')), '')
          if not url:
              raise SystemExit('Credly SAL2 image URL not found or not hosted on images.credly.com')
          Path('/tmp/sal2-image-url').write_text(url, encoding='utf-8')
          PY
          curl --fail --location --retry 3 --retry-delay 2 \
            "$(cat /tmp/sal2-image-url)" \
            --output assets/badges/sal2.png
          test "$(file --brief --mime-type assets/badges/sal2.png)" = 'image/png'

      - name: Fetch eCTHP PNG from current INE certification page asset
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://us-east-1.graphassets.com/AwCYQkwjSUCbfkm08Ct1Mz/output=format:png/cmcc3k3loazi006k52vly6jlo' \
            --output assets/badges/ecthp.png
          test "$(file --brief --mime-type assets/badges/ecthp.png)" = 'image/png'

      - name: Commit credential badge assets
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/badges; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/badges
          git commit -m 'chore: sync credential badge PNGs'
          git push
