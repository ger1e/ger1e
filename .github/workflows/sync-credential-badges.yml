name: sync-credential-badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-credential-badges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch CySA+ Credly badge PNG
        run: |
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'
      - name: Remove non-Credly badge mirrors
        run: rm -f assets/badges/ecthp.png assets/badges/sal2.png
      - name: Commit Credly badge asset
        run: |
          if git diff --quiet -- assets/badges; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/badges
          git commit -m 'chore: sync Credly credential badge PNG'
          git push
