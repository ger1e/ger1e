name: sync-credential-badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-credential-badges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch CySA+ Credly badge PNG
        run: |
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'
      - name: Resolve SAL2 from TryHackMe Credly badge page
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.credly.com/org/tryhackme/badge/security-analyst-level-2-sal2'
          html="$(curl --fail --location --retry 3 --retry-delay 2 "$page")"
          printf '%s' "$html" | grep -qi 'Security Analyst Level 2'
          image_url="$(printf '%s' "$html" | python -c 'import html,re,sys; s=sys.stdin.read(); m=re.search(r"<meta[^>]+(?:property|name)=[\"'\"'](?:og:image|twitter:image)[\"'\"'][^>]+content=[\"'\"']([^\"'\"']+)", s, re.I) or re.search(r"<meta[^>]+content=[\"'\"']([^\"'\"']+)[\"'\"'][^>]+(?:property|name)=[\"'\"'](?:og:image|twitter:image)[\"'\"']", s, re.I); print(html.unescape(m.group(1)) if m else "")')"
          test -n "$image_url"
          case "$image_url" in
            https://images.credly.com/*) ;;
            *) echo "Refusing non-Credly SAL2 image: $image_url" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 --retry-delay 2 "$image_url" --output assets/badges/sal2.png
          test "$(file --brief --mime-type assets/badges/sal2.png)" = 'image/png'
      - name: Keep eCTHP out of Credly sync
        run: rm -f assets/badges/ecthp.png
      - name: Commit credential badge assets
        run: |
          if git diff --quiet -- assets/badges; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/badges
          git commit -m 'chore: sync Credly credential badge PNGs'
          git push
