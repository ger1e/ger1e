name: sync-credential-badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-credential-badges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch CySA+ badge PNG
        run: |
          mkdir -p assets/badges
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.credly.com/images/dcd99b5b-da24-40a6-9364-62126d590c37/blob' \
            --output assets/badges/cysa-plus.png
          test "$(file --brief --mime-type assets/badges/cysa-plus.png)" = 'image/png'
      - name: Fetch eCTHP badge PNG
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://assets.ine.com/els-static/els-certs/ecthpv2.png' \
            --output assets/badges/ecthp.png
          test "$(file --brief --mime-type assets/badges/ecthp.png)" = 'image/png'
      - name: Fetch SAL2 badge PNG
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://tryhackme.com/static/image/sal2-card.3660689e.png' \
            --output assets/badges/sal2.png
          test "$(file --brief --mime-type assets/badges/sal2.png)" = 'image/png'
      - name: Commit badge assets
        run: |
          if git diff --quiet -- assets/badges; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/badges/cysa-plus.png assets/badges/ecthp.png assets/badges/sal2.png
          git commit -m 'chore: sync credential badge PNGs'
          git push
