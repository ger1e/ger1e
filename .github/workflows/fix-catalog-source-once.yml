name: Fix stale catalog source once

on:
  push:
    branches:
      - docs/mobile-density-profilewide

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mobile-density-profilewide
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair catalog source set and regenerate
        run: python .github/fix_catalog_source_once.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog.py catalog/repos.yaml CATALOG.md PROVIDERS.md
          git commit -m "fix(catalog): drop removed SOC manual source"
          git push
