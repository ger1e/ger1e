name: Restore catalog data once

on:
  push:
    branches:
      - docs/mobile-density-profilewide

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mobile-density-profilewide
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore canonical catalog data and regenerate compact output
        run: python .github/restore_catalog_data_once.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/repos.yaml CATALOG.md PROVIDERS.md
          git commit -m "chore(catalog): preserve canonical data during docs pass"
          git push
