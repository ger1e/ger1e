name: Mobile docs one-shot

on:
  push:
    branches:
      - docs/mobile-density-profilewide

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mobile-density-profilewide
      - name: Apply compact Markdown hierarchy
        run: python .github/mobile_docs_once.py
      - name: Validate profile catalogs
        run: python -m unittest discover -s tests -v
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No Markdown changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add API-TOOLS-REPOS.md CATALOG.md LAST-VERIFIED.md PROVIDERS.md SECURITY-REPOS.md SECURITY.md docs lab tools/catalog.py
          git commit -m "docs: compact profile Markdown for mobile"
          git push
